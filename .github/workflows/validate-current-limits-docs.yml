name: Validate current limits alignment
on:
  push:
    branches: ["chore/current-limits-docs-2026-09-16"]
    paths: [".github/workflows/validate-current-limits-docs.yml"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/current-limits-docs-2026-09-16
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Remove one-time validator
        run: |
          rm .github/workflows/validate-current-limits-docs.yml
          git config user.name "OnceHere Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-time limits validator"
          git push origin HEAD:chore/current-limits-docs-2026-09-16
