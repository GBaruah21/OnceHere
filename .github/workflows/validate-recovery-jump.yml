name: Validate recovery and jump fixes
on:
  push:
    branches: ["fix/recovery-key-jump-2026-09-16"]
    paths: [".github/workflows/validate-recovery-jump.yml"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-key-jump-2026-09-16
      - run: python3 .github/fix-recovery-jump.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit tested fix
        run: |
          rm .github/fix-recovery-jump.py .github/workflows/validate-recovery-jump.yml
          git config user.name "OnceHere Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix owner recovery download and section navigation"
          git push origin HEAD:fix/recovery-key-jump-2026-09-16
