name: OnceHere audit cleanup

on:
  push:
    paths:
      - .github/workflows/oncehere-audit-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch obsolete preview UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          editor = Path('src/components/editor/ArchiveEditor.tsx')
          text = editor.read_text()
          state = "  const [deployModalInitialTab, setDeployModalInitialTab] = useState<'configure' | 'preview'>('configure');\n"
          text = text.replace(state, '')
          start = text.find('          <button\n            type="button"\n            onClick={() => {\n              setDeployModalInitialTab(\'preview\');')
          if start < 0:
              raise SystemExit('obsolete live preview button not found')
          end_marker = '          {/* Primary Deployment Action */}'
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('deployment action marker not found')
          text = text[:start] + text[end:]
          text = text.replace("            onClick={() => {\n              setDeployModalInitialTab('configure');\n              setIsDeployModalOpen(true);\n            }}\n", "            onClick={() => setIsDeployModalOpen(true)}\n")
          text = text.replace('      {/* Deploy & Domain Selection Modal (With Interactive Live Preview) */}\n', '      {/* Deploy & Domain Selection Modal */}\n')
          text = text.replace('        initialTab={deployModalInitialTab}\n', '')
          editor.write_text(text)

          deploy = Path('src/components/editor/DeployModal.tsx')
          text = deploy.read_text()
          text = text.replace("  /** Kept for compatibility with older editor builds. Embedded pre-deploy preview was removed. */\n  initialTab?: 'configure' | 'preview';\n", '')
          text = text.replace(
              '                The broken embedded “preview before deploy” has been removed. Your editor already shows the current archive while you build it; after publishing, use <strong className="text-white">Visit Live Site</strong> to verify the real public page.\n',
              '                Review the archive in the Studio preview while you build it. When it is ready, choose its public address here and publish; after publishing, use <strong className="text-white">Visit Live Site</strong> to verify the visitor view.\n'
          )
          deploy.write_text(text)

          hero = Path('src/components/landing/HeroSection.tsx')
          text = hero.read_text()
          text = text.replace('<span>Instant preview before domain claim</span>', '<span>Live preview while you build</span>')
          hero.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit audited fixes
        shell: bash
        run: |
          rm .github/workflows/oncehere-audit-cleanup.yml
          git config user.name "OnceHere Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[oncehere-audit] Remove obsolete pre-deploy preview remnants"
          git push origin HEAD:main
