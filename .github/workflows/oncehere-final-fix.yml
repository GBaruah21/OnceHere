name: OnceHere final fix validation

on:
  push:
    branches:
      - ai/final-oncehere-fixes

permissions:
  contents: write

jobs:
  patch_and_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply fixes
        run: python3 scripts/apply_final_fixes.py

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit validated changes
        run: |
          rm -f .github/workflows/oncehere-final-fix.yml
          rm -f scripts/apply_final_fixes.py
          git config user.name "OnceHere Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[oncehere-final] Enforce media limits and permanent recovery key"
          git push origin HEAD:ai/final-oncehere-fixes
