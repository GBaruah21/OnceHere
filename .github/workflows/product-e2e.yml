name: Product Hardening Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [product-hardening-major-fixes]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run unit and API tests
        run: npm test

      - name: Build production client and server
        run: npm run build

      - name: Install E2E dependencies
        run: npm --prefix e2e install

      - name: Install Chromium
        run: npm --prefix e2e exec -- playwright install --with-deps chromium

      - name: Run Playwright lifecycle tests
        run: npm --prefix e2e test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
